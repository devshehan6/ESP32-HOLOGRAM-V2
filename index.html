<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connect • LED Controller</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #171a2b;
    --accent: #4f8cff;
    --accent-2: #22c55e;
    --text: #e7e9f3;
    --muted: #9aa0b4;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1b2140 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--panel);
    border: 1px solid #262b45;
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  h1 { margin: 0 0 4px; font-size: 1.3rem; }
  .subtitle { color: var(--muted); font-size: .88rem; margin-bottom: 22px; }
  label { font-size: .85rem; color: var(--muted); display: block; margin-bottom: 6px; }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    background: #0e1122;
    border: 1px solid #2a3050;
    border-radius: 10px;
    color: var(--text);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: .95rem;
  }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: .95rem;
    transition: filter .15s;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .status {
    margin-top: 14px;
    font-size: .85rem;
    color: var(--muted);
    min-height: 1.2em;
    text-align: center;
  }
  .status.ok { color: var(--accent-2); }
  .status.err { color: var(--danger); }
  .hint {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid #262b45;
    font-size: .78rem;
    color: var(--muted);
    line-height: 1.5;
  }
  .hint code { color: #b9c2ff; }
</style>
</head>
<body>
  <div class="card">
    <h1>Connect to LED Controller</h1>
    <div class="subtitle">Enter the device IP address to open the control panel.</div>

    <label for="ipInput">Device IP</label>
    <input id="ipInput" type="text" placeholder="e.g. 192.168.1.42" autocomplete="off" />

    <button id="connectBtn">Connect</button>
    <div id="status" class="status"></div>

    <div class="hint">
      Tip: the device prints its IP on the Serial Monitor at <code>115200</code> baud.<br />
      The last successful IP is saved locally in your browser.
    </div>
  </div>

<script>
const IP_KEY = "shiftReg_deviceIP";
const ipInput = document.getElementById("ipInput");
const connectBtn = document.getElementById("connectBtn");
const statusEl = document.getElementById("status");

function setStatus(msg, cls = "") {
  statusEl.textContent = msg;
  statusEl.className = "status " + cls;
}

// ---------- Default IP detection ----------
function getDefaultIP() {
  const saved = localStorage.getItem(IP_KEY);
  if (saved) return saved;
  const host = window.location.hostname;
  if (/^\d+\.\d+\.\d+\.\d+$/.test(host)) return host;
  if (host && host !== "localhost") return host;
  return "192.168.4.1";
}
ipInput.value = getDefaultIP();

// ---------- Connect ----------
async function tryConnect() {
  const ip = ipInput.value.trim();
  if (!ip) { setStatus("Please enter an IP address.", "err"); return; }

  connectBtn.disabled = true;
  setStatus("Connecting to " + ip + " ...");

  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 4000);
    const res = await fetch(`http://${ip}/ping`, { signal: ctrl.signal });
    clearTimeout(t);
    if (!res.ok) throw new Error("HTTP " + res.status);

    localStorage.setItem(IP_KEY, ip);
    setStatus("Connected! Opening control panel...", "ok");
    setTimeout(() => { window.location.href = "test.html"; }, 600);
  } catch (e) {
    setStatus("Connection failed: " + (e.message || "timeout"), "err");
    connectBtn.disabled = false;
  }
}

connectBtn.addEventListener("click", tryConnect);
ipInput.addEventListener("keydown", e => { if (e.key === "Enter") tryConnect(); });
</script>
</body>
</html>
