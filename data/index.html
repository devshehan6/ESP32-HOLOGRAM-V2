<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Hologram Control</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    h1 {
      text-align: center;
      margin-bottom: 25px;
      background: linear-gradient(90deg, #00d4ff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 26px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #b0b0d0;
      font-size: 14px;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border 0.3s;
      margin-bottom: 18px;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: #00d4ff;
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.4);
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #00d4ff, #a855f7);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
    }
    button:active { transform: translateY(0); }
    .status {
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
      color: #00ff88;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ ESP32 Hologram ✨</h1>

    <label for="holoText">Hologram Text</label>
    <input type="text" id="holoText" placeholder="Enter text for hologram..." value="Hello Hologram!" />

    <button onclick="sendText()">Send to ESP32</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    async function sendText() {
      const text = document.getElementById('holoText').value;
      const statusEl = document.getElementById('status');

      if (!text.trim()) {
        statusEl.style.color = '#ff5577';
        statusEl.textContent = 'Please enter some text!';
        return;
      }

      try {
        const response = await fetch('/send', {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: text
        });

        if (response.ok) {
          statusEl.style.color = '#00ff88';
          statusEl.textContent = '✅ Sent: "' + text + '"';
        } else {
          statusEl.style.color = '#ff5577';
          statusEl.textContent = '❌ Failed to send';
        }
      } catch (err) {
        statusEl.style.color = '#ff5577';
        statusEl.textContent = '❌ Error: ' + err.message;
      }
    }

    // Enter key එකෙන් send කරන්න
    document.getElementById('holoText').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendText();
    });
  </script>
</body>
</html>
