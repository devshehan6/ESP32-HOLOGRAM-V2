<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Control Panel • LED Controller</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #171a2b;
    --card: #0e1122;
    --accent: #4f8cff;
    --accent-2: #22c55e;
    --text: #e7e9f3;
    --muted: #9aa0b4;
    --danger: #ef4444;
    --switch-off: #333852;
    --border: #2a3050;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1b2140 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 16px 12px 90px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .topbar h1 { margin: 0; font-size: 1.1rem; }
  .topbar .ip { color: var(--muted); font-size: .75rem; font-family: ui-monospace, monospace; word-break: break-all; }

  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--border);
    font-size: .82rem;
    user-select: none;
    cursor: pointer;
  }
  .pill.active { border-color: var(--accent); }

  .bulb {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #555;
    transition: background .2s, box-shadow .2s;
  }
  .bulb.online { background: var(--accent-2); box-shadow: 0 0 10px 2px rgba(34,197,94,.55); }
  .bulb.offline { background: var(--danger); box-shadow: 0 0 10px 2px rgba(239,68,68,.45); }

  .mini-switch {
    position: relative;
    width: 36px; height: 20px;
    background: var(--switch-off);
    border-radius: 999px;
    transition: background .25s;
    flex: 0 0 auto;
  }
  .mini-switch::before {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #e7e9f3;
    transition: transform .25s;
  }
  .pill.live-on .mini-switch { background: var(--accent-2); }
  .pill.live-on .mini-switch::before { transform: translateX(16px); }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .row-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .row-title { font-size: .92rem; font-weight: 600; }
  .row-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .mini-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    font-size: .76rem;
    cursor: pointer;
    color: var(--muted);
    user-select: none;
  }
  .mini-pill:active { color: var(--text); }
  .remove-btn {
    padding: 6px 10px;
    border-radius: 8px;
    background: #3a1f24;
    border: 1px solid #5b2a33;
    color: #ff9aa6;
    font-size: .76rem;
    cursor: pointer;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  @media (max-width: 480px) { .grid { grid-template-columns: repeat(2, 1fr); } }

  .switch-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 8px;
    text-align: center;
  }
  .switch-item .num { font-size: .74rem; color: var(--muted); margin-bottom: 6px; }

  .switch { position: relative; display: inline-block; width: 52px; height: 28px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: var(--switch-off);
    border-radius: 999px;
    transition: .25s;
  }
  .slider::before {
    content: "";
    position: absolute;
    height: 20px; width: 20px;
    left: 4px; top: 4px;
    background: #e7e9f3;
    border-radius: 50%;
    transition: .25s;
  }
  input:checked + .slider { background: var(--accent-2); }
  input:checked + .slider::before { transform: translateX(24px); }

  .bottom-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .btn {
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    font-size: .92rem;
    color: white;
    transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primary { background: var(--accent); flex: 1; min-width: 150px; }
  .btn.success { background: var(--accent-2); }
  .btn.secondary { background: #2a3050; }
  .btn.danger { background: #b13a3a; }

  .status {
    margin-top: 10px;
    font-size: .82rem;
    color: var(--muted);
    min-height: 1.2em;
  }
  .status.ok { color: var(--accent-2); }
  .status.err { color: var(--danger); }

  /* Floating bottom Next bar */
  .next-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(15,18,32,.98), rgba(15,18,32,.85));
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  .next-bar .btn { max-width: 980px; width: 100%; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>LED Control Panel</h1>
        <div class="ip" id="ipLabel">—</div>
      </div>
      <div class="pills">
        <div class="pill" id="onlinePill" title="Device online status">
          <span class="bulb" id="bulb"></span>
          <span id="onlineText">Checking…</span>
        </div>
        <div class="pill" id="livePill" title="When ON, changes are sent instantly">
          <span>Live</span>
          <span class="mini-switch"></span>
        </div>
      </div>
    </div>

    <div id="rowsContainer"></div>

    <div class="bottom-actions">
      <button class="btn secondary" id="addRowBtn">+ Add Row</button>
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="row-head">
        <div class="row-title">Global Controls</div>
      </div>
      <div class="bottom-actions">
        <button class="btn success" id="allOnBtn">All On</button>
        <button class="btn danger" id="allOffBtn">All Off</button>
        <button class="btn primary" id="sendBtn">Send</button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </div>

  <!-- Next button opens frame.html with current state -->
  <div class="next-bar">
    <button class="btn primary" id="nextBtn">Next →</button>
  </div>

<script>
// ---------- Constants ----------
const IP_KEY = "shiftReg_deviceIP";
const STATE_KEY = "shiftReg_lastState";
const SWITCHES_PER_ROW = 8;
const MAX_BITS = 16;

// ---------- Elements ----------
const ipLabel     = document.getElementById("ipLabel");
const bulb        = document.getElementById("bulb");
const onlineText  = document.getElementById("onlineText");
const livePill    = document.getElementById("livePill");
const rowsContainer = document.getElementById("rowsContainer");
const addRowBtn   = document.getElementById("addRowBtn");
const allOnBtn    = document.getElementById("allOnBtn");
const allOffBtn   = document.getElementById("allOffBtn");
const sendBtn     = document.getElementById("sendBtn");
const statusEl    = document.getElementById("status");
const nextBtn     = document.getElementById("nextBtn");

// ---------- State ----------
const ip = localStorage.getItem(IP_KEY) || "";
let liveMode = false;
let rows = [];

ipLabel.textContent = ip ? `Device: ${ip}` : "No device IP configured";
if (!ip) setStatus("No device IP. Please go back and connect first.", "err");

function setStatus(msg, cls = "") {
  statusEl.textContent = msg;
  statusEl.className = "status " + cls;
}

// ---------- Build a row ----------
function createRow() {
  const rowEl = document.createElement("div");
  rowEl.className = "card";
  const rowIndex = rows.length;

  rowEl.innerHTML = `
    <div class="row-head">
      <div class="row-title">Row ${rowIndex + 1}</div>
      <div class="row-actions">
        <div class="mini-pill" data-action="row-on">All On</div>
        <div class="mini-pill" data-action="row-off">All Off</div>
        <button class="remove-btn" data-action="remove">Remove</button>
      </div>
    </div>
    <div class="grid"></div>
  `;

  const grid = rowEl.querySelector(".grid");
  const switches = [];
  for (let i = 0; i < SWITCHES_PER_ROW; i++) {
    const item = document.createElement("div");
    item.className = "switch-item";
    item.innerHTML = `
      <div class="num">LED ${i + 1}</div>
      <label class="switch">
        <input type="checkbox" data-index="${i}" />
        <span class="slider"></span>
      </label>
    `;
    const input = item.querySelector("input");
    input.addEventListener("change", () => { if (liveMode) sendCurrentState(); });
    grid.appendChild(item);
    switches.push(input);
  }

  rowEl.querySelector('[data-action="row-on"]').addEventListener("click", () => {
    switches.forEach(s => s.checked = true);
    if (liveMode) sendCurrentState();
  });
  rowEl.querySelector('[data-action="row-off"]').addEventListener("click", () => {
    switches.forEach(s => s.checked = false);
    if (liveMode) sendCurrentState();
  });
  rowEl.querySelector('[data-action="remove"]').addEventListener("click", () => {
    rowEl.remove();
    rows = rows.filter(r => r.el !== rowEl);
    refreshRowTitles();
    if (liveMode) sendCurrentState();
  });

  rowsContainer.appendChild(rowEl);
  rows.push({ el: rowEl, switches });
  refreshRowTitles();
}

function refreshRowTitles() {
  rows.forEach((r, i) => {
    const t = r.el.querySelector(".row-title");
    if (t) t.textContent = `Row ${i + 1}`;
  });
}

// ---------- Compute 16-bit value ----------
function buildValue() {
  let value = 0;
  for (let r = 0; r < rows.length; r++) {
    for (let i = 0; i < SWITCHES_PER_ROW; i++) {
      const bit = r * SWITCHES_PER_ROW + i;
      if (bit >= MAX_BITS) continue;
      if (rows[r].switches[i].checked) value |= (1 << bit);
    }
  }
  return value >>> 0;
}

function applyState(state) {
  for (let r = 0; r < rows.length; r++) {
    for (let i = 0; i < SWITCHES_PER_ROW; i++) {
      const bit = r * SWITCHES_PER_ROW + i;
      if (bit >= MAX_BITS) continue;
      rows[r].switches[i].checked = ((state >> bit) & 1) === 1;
    }
  }
}

// ---------- Send ----------
// ---------- Send current switch state as a 1ms single-line frame ----------
// Uses /frames so ESP plays it as a frame (which also stops any running pattern).
let sendInFlight = false;
async function sendCurrentState() {
  if (!ip) return;
  if (sendInFlight) return;
  sendInFlight = true;

  // Build 16-bit value from the switches
  const value = buildValue();

  // Convert to a 16-char binary string (MSB first).
  // ESP parses bit strings left-to-right, first char = highest bit.
  const bits = (value >>> 0).toString(2).padStart(16, "0");

  // Payload: 1 line, delay 1 ms
  const payload = JSON.stringify({
    delay: 1,
    lines: [bits]
  });

  try {
    const res = await fetch(`http://${ip}/frames`, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },   // no CORS preflight
      body: payload
    });
    if (!res.ok) {
      const t = await res.text();
      throw new Error("HTTP " + res.status + " " + t);
    }
    const data = await res.json();
    setStatus(`Sent ${value} • lines=${data.lines} • delay=${data.delay}ms`, "ok");
    setOnline(true);
  } catch (e) {
    setStatus("Send failed: " + e.message, "err");
    setOnline(false);
  } finally {
    sendInFlight = false;
  }
}

// ---------- Online bulb ----------
let online = false;
function setOnline(v) {
  if (online === v) return;
  online = v;
  bulb.classList.toggle("online", v);
  bulb.classList.toggle("offline", !v);
  onlineText.textContent = v ? "Online" : "Offline";
}
async function pingDevice() {
  if (!ip) { setOnline(false); return; }
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 2500);
    const res = await fetch(`http://${ip}/ping`, { signal: ctrl.signal, cache: "no-store" });
    clearTimeout(t);
    setOnline(res.ok);
  } catch { setOnline(false); }
}

// ---------- Live switch ----------
function setLiveMode(on) {
  liveMode = on;
  livePill.classList.toggle("live-on", on);
  livePill.classList.toggle("active", on);
  sendBtn.disabled = on;
}
livePill.addEventListener("click", () => setLiveMode(!liveMode));

// ---------- Global buttons ----------
addRowBtn.addEventListener("click", createRow);
allOnBtn.addEventListener("click", () => {
  rows.forEach(r => r.switches.forEach(s => s.checked = true));
  if (liveMode) sendCurrentState();
});
allOffBtn.addEventListener("click", () => {
  rows.forEach(r => r.switches.forEach(s => s.checked = false));
  if (liveMode) sendCurrentState();
});
sendBtn.addEventListener("click", () => sendCurrentState());

// ---------- Next → frame.html ----------
// Store the current snapshot (rows + switch states) so frame.html can read it.
nextBtn.addEventListener("click", () => {
  const totalLeds = rows.length * SWITCHES_PER_ROW;
  // Persist snapshot too (optional) - frame.html only needs the count
  localStorage.setItem("shiftReg_ledCount", String(totalLeds));
  window.location.href = `frame.html?leds=${totalLeds}`;
});

// ---------- Init ----------
createRow();
createRow();

(async () => {
  if (ip) {
    try {
      const res = await fetch(`http://${ip}/status`);
      if (res.ok) {
        const data = await res.json();
        applyState(data.state);
        setOnline(true);
      }
    } catch { setOnline(false); }
  }
  setInterval(pingDevice, 5000);
})();
</script>
</body>
</html>
